configuration:
  printers:
    name: Printers
    description: One entry per printer, with an id of a-z and 0-9. Keep printer1 for the existing printer. When empty, the single-printer options below are used.
    fields:
      id:
        name: ID
        description: Short and permanent, for example printer1.
      name:
        name: Name
        description: Shown in the UI and in the MQTT device name.
      moonraker_url:
        name: Moonraker URL
        description: For example http://192.168.1.50:7125. Creality K1 series printers also work on port 4408.
      energy_sensor:
        name: Energy sensor
        description: Entity ID of a total energy counter in kWh, not a daily one.
  moonraker_url:
    name: Moonraker URL (single printer)
    description: For example http://192.168.1.50:7125. Used when the printers list is empty.
  printer_name:
    name: Printer name (single printer)
    description: Used when the printers list is empty.
  energy_sensor:
    name: Energy sensor (single printer)
    description: Entity ID of a total energy counter in kWh. Used when the printers list is empty.
  electricity_price:
    name: Electricity price
    description: Price per kWh.
  default_filament_price:
    name: Default filament price
    description: Price per kg, used when Spoolman has no price.
  currency:
    name: Currency
    description: Display only.
  google_sheets_config_entry:
    name: Google Sheets config entry
    description: When set, a row is appended for every print.
  google_sheets_worksheet:
    name: Google Sheets worksheet
    description: The worksheet must already exist.
  mqtt_host:
    name: MQTT host
    description: Only needed when the Mosquitto app is not installed.
  mqtt_port:
    name: MQTT port
    description: Defaults to 1883.
  mqtt_username:
    name: MQTT username
    description: Manual broker login.
  mqtt_password:
    name: MQTT password
    description: Manual broker login.
  direct_url:
    name: Direct URL
    description: Address of the optional direct port, for example http://printer-pi.example:8100. Enables direct links.
  auto_fetch_layouts:
    name: Fetch slicer layouts
    description: Generate metadata from OrcaSlicer sources when a slicer version is not bundled.
  spool_margin_percent:
    name: Spool margin
    description: Spare filament, in percent, the active spool should have on top of what the print needs.
  spool_check_auto_pause:
    name: Pause on a spool problem
    description: Pause automatically when the filament isn't enough or the material differs.
  abrasive_patterns:
    name: Abrasive filament patterns
    description: Regular expression matched against the material and the spool name.
  thumbnail_retention_days:
    name: Keep thumbnails, days
    description: Older pictures are removed, the print records stay. 0 keeps them all.
  calibration_stale_days:
    name: Calibration goes stale after, days
    description: Older calibrations get a hint to repeat them.
  log_level:
    name: Log level
    description: How much detail to write to the log.
network:
  8100/tcp: Optional read-only web UI outside Home Assistant
