name: Klipper Print Tracker
version: "0.3.0"
slug: klipper_print_tracker
description: Tracks every Klipper print and keeps a git history of the slicer settings
url: https://github.com/currentlib/KlipperPrintTracker
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: Print Tracker
homeassistant_api: true
services:
  - mqtt:want
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Optional read-only web UI outside Home Assistant (not needed with ingress)
options:
  printers: []
  printer_name: 3D Printer
  electricity_price: 0
  default_filament_price: 0
  currency: UAH
  google_sheets_worksheet: Print Tracker
  auto_fetch_layouts: true
  spool_margin_percent: 5
  spool_check_auto_pause: false
  abrasive_patterns: CF|GF|glow
  thumbnail_retention_days: 365
  calibration_stale_days: 180
  log_level: info
schema:
  printers:
    - id: match(^[a-z0-9]+$)
      name: str
      moonraker_url: url
      energy_sensor: str?
  moonraker_url: url?
  printer_name: str
  energy_sensor: str?
  electricity_price: float(0,)
  default_filament_price: float(0,)
  currency: str
  google_sheets_config_entry: str?
  google_sheets_worksheet: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  direct_url: url?
  auto_fetch_layouts: bool
  spool_margin_percent: float(0,)
  spool_check_auto_pause: bool
  abrasive_patterns: str?
  thumbnail_retention_days: int(0,)
  calibration_stale_days: int(1,)
  log_level: list(debug|info|warning|error)
